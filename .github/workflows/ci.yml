name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite
        run: pytest tests/ -v --tb=short --cov=sofr_engine --cov=models --cov=backtesting --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verify imports
        run: |
          python -c "from sofr_engine import SOFRCurveBootstrapper, SOFRSwap"
          python -c "from models import compute_taylor_rule, fit_nelson_siegel"
          python -c "from backtesting import WalkForwardBacktest, full_metrics"
